name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository is public and was extracted from a private one.
      # The scrub gate runs first and independently: if private context is
      # present, nothing else about the build matters.
      - name: scrub gate
        run: scripts/scrub-check.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The deploy tree (netlify/, netlify.toml, package.json, package-lock.json)
      # is what the P4-S connect tool (#80) copies verbatim. npm ci fails if the root
      # lockfile is missing or out of sync with package.json, so this step
      # keeps the committed lockfile honest without changing any dependency.
      - name: root lockfile is in sync
        run: npm ci --ignore-scripts --no-audit --no-fund

      # notify() runs after the authoritative write, so a body it rejects that
      # the store accepted is a 500 for a comment that already landed. The two
      # grammars are only kept in step by being asserted against each other.
      - name: notify() accepts what the store accepts
        run: node netlify/lib/notify.test.mjs

      - name: typecheck
        run: npm --prefix templates/docbuild ci --no-audit --no-fund && npm --prefix templates/docbuild run check

      - name: Check inline converter parity
        run: node scripts/check-inline-md.mjs

      # The unit tests were written before anything ran them, and a test that
      # never executes cannot hold a regression out. Every file is named
      # explicitly rather than globbed: `node --test` treats an unmatched
      # pattern as a glob that matches nothing and exits 0, and a glob that
      # still matches some other test file would go green with this one
      # silently dropped. A literal path that stops being emitted fails loudly.
      # Add new test files to this list.
      - name: unit tests
        run: |
          npm --prefix templates/docbuild run build
          node --test \
            templates/docbuild/dist/index.test.js \
            templates/docbuild/dist/anchors.test.js
          node --test scripts/connect.test.mjs

      - name: edge gate config is fail-closed
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const toml = readFileSync("netlify.toml", "utf8");
          const marker = "[[edge_functions]]";
          const start = toml.indexOf(marker);
          assert.notEqual(start, -1, "missing [[edge_functions]] block");
          assert.equal(toml.indexOf(marker, start + marker.length), -1, "expected exactly one edge_functions block");
          const tail = toml.slice(start + marker.length);
          const nextBlock = tail.search(/^\[/m);
          const block = nextBlock === -1 ? tail : tail.slice(0, nextBlock);
          assert.match(block, /^\s*path\s*=\s*"\/\*"\s*$/m);
          assert.match(block, /^\s*function\s*=\s*"gate"\s*$/m);
          const line = block.match(/^\s*excludedPath\s*=\s*\[(.*)\]\s*$/m);
          assert.ok(line, "missing excludedPath");
          const quoted = [...line[1].matchAll(/"([^"]+)"/g)].map((match) => match[1]);
          assert.deepEqual(quoted, ["/login/*", "/api/*", "/_assets/*"]);
          assert.equal(line[1].replace(/"[^"]+"/g, "").replace(/[\s,]/g, ""), "");
          console.log("PASS  edge gate config is fail-closed");
          NODE

      - name: complete site builds
        run: templates/build --site

      - name: every document rebuilds byte-identically
        run: templates/check-dist
