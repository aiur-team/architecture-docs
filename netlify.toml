# Fail-closed Netlify configuration for the repo-backed _site build.
#
# The site entry point is exactly one command (templates/build --site) and the
# publish directory is the disposable _site/ tree the builder writes from
# scratch. The edge gate below is declared before its implementation exists
# (P2-A owns netlify/edge-functions/gate.ts); do not weaken it, add a
# catch-all exclusion, or remove the block to make a pre-P2-A deploy pass.

[build]
  command = "templates/build --site"
  publish = "_site"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':!*.md' ':!**/dist/**'"

[build.environment]
  NODE_VERSION = "22"

[build.processing]
  skip_processing = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/*"
  excludedPath = ["/login/*", "/api/*", "/_assets/*"]
  function = "gate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.production.environment]
  DOC_ENV = "production"

[context.deploy-preview.environment]
  DOC_ENV = "preview"

[context.branch-deploy.environment]
  DOC_ENV = "preview"
